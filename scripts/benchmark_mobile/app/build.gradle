plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lightmis.mobilebenchmark'
    compileSdk 35

    defaultConfig {
        applicationId 'org.lightmis.mobilebenchmark'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // LiteRT v1 keeps the classic Interpreter API and standalone GPU delegate.
    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.1'
}
